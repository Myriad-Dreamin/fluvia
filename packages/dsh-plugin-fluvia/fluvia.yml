# dsh patch overlay that mounts `dsh-plugin-fluvia`.
#
# Pass it with `--patch`, which the launcher applies after every bundle layer
# and after the profile's own cordis.patch.yml:
#
#   dsh --profile web --patch <this file> --port 3080 --no-open
#
# The file is a top-level array of loader patch entries. `insert` adds rows
# that no earlier layer defined — which is what a new out-of-tree plugin is.
#
# The package must already be installed into the profile, so that the bare
# specifier below resolves from the profile directory:
#
#   dsh plugin --profile web add <absolute path to this package>
#
# A fluvia runtime must be listening before dsh boots; the plugin reads the
# instruction set from it at load and fails loudly if it cannot:
#
#   pnpm serve --listen unix:/tmp/fluvia.sock
#
# Every `config` key below is the schema default; they are written out because
# this file doubles as the documented surface, and a default you can see is a
# default you can change.

- insert:
    - id: fluvia
      name: dsh-plugin-fluvia
      config:
        # `connect` is the sandboxed shape: the runtime lives outside this
        # process and only submissions and results cross the socket.
        # `http` is the unsplit alternative and offers no isolation.
        transport: connect

        # Where the runtime listens. A unix socket keeps the endpoint inside the
        # filesystem's permission model; `tcp:<host>:<port>` needs `tokenFile`.
        connect: unix:/tmp/fluvia.sock

        # Shared secret file, when the runtime runs with --token-file.
        # Mandatory on the runtime side for any tcp: address.
        tokenFile: ''

        # Label prefix requested per session. Empty derives `dsh-<session id>`.
        # The runtime sanitizes and uniquifies it; it assigns the final id.
        label: ''

        # NOTE: there is deliberately no `preload` or `concurrency` here. They
        # decide what an instruction DOES and how much host it may use, so they
        # belong to `pnpm serve` on the other side of the boundary. Putting them
        # here would hand the instruction set to the process the model runs in.

        # `followup` wakes an idle agent so it reacts to the notification.
        # `inject` waits for the next pre-step. `auto` picks per agent status.
        mode: followup

        # Fallback only. An envelope whose owning session is known routes to
        # that session regardless of this setting.
        target: newest

        # Envelopes held while no agent owns them; oldest evicted past this.
        queueLimit: 200

        # The local status endpoint: GET / for a page, GET <path> for JSON.
        # Under `transport: http` the same path also accepts envelope POSTs.
        host: 127.0.0.1
        port: 7788
        path: /inbox
